plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gatti.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.gatti.game"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            // nessuna signingConfig: l'APK di release viene prodotto non firmato
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}

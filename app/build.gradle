plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gatti.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.gatti.game"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            // nessuna signingConfig: l'APK di release viene prodotto non firmato
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Alcune librerie AndroidX trascinano vecchi kotlin-stdlib-jdk7/jdk8 (1.6.x) che
// duplicano le classi di kotlin-stdlib 1.8+: qui allineo tutto a una sola versione.
configurations.configureEach {
    resolutionStrategy {
        eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin' &&
                    (details.requested.name == 'kotlin-stdlib-jdk7' ||
                     details.requested.name == 'kotlin-stdlib-jdk8' ||
                     details.requested.name == 'kotlin-stdlib-jre7' ||
                     details.requested.name == 'kotlin-stdlib-jre8')) {
                details.useTarget "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
                details.because 'evita le classi duplicate di kotlin-stdlib'
            }
            if (details.requested.group == 'org.jetbrains.kotlin' &&
                    details.requested.name == 'kotlin-stdlib') {
                details.useVersion '1.9.24'
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.8.2'
}

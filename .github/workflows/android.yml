name: Build APK Android

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build APK debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build APK release (non firmato)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rinomina gli APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Gatti-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/Gatti-release-unsigned.apk

      - name: Carica gli APK come artifact
        uses: actions/upload-artifact@v7
        with:
          name: Gatti-apk
          path: out/*.apk
          if-no-files-found: error

name: Build APK Android

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_FILE: ${{ github.workspace }}/gatti-release.jks
      KEYSTORE_PASSWORD: gattigatti
      KEY_ALIAS: gatti
      KEY_PASSWORD: gattigatti

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Crea la chiave di firma
        run: |
          keytool -genkeypair -v -keystore "$KEYSTORE_FILE" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=Gatti, O=Gatti, C=IT"

      - name: Build APK debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build APK release (firmato)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Raccogli e verifica gli APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Gatti-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/Gatti-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs out/Gatti-debug.apk
          "$BT/apksigner" verify --print-certs out/Gatti-release.apk
          ls -l out

      - name: Carica gli APK come artifact
        uses: actions/upload-artifact@v7
        with:
          name: Gatti-apk
          path: out/*.apk
          if-no-files-found: error
